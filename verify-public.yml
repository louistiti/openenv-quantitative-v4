name: Verify anonymous immutable quantitative image
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  anonymous:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: quantitative-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Read immutable digest from public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download quantitative-v1 --pattern image-digest.txt --pattern submission-quantitative-v1.json
      - name: Anonymous image pull and all-task network replay
        run: |
          set -euo pipefail
          export DOCKER_CONFIG="$(mktemp -d)"
          image="$(cat image-digest.txt)"
          docker pull "$image"
          docker inspect "$image" > image-public-inspect.json
          docker run -d --name quant-public -p 8768:8000 "$image"
          trap 'docker logs quant-public; docker rm -f quant-public; rm -rf "$DOCKER_CONFIG"' EXIT
          for i in $(seq 1 90); do curl -fsS http://127.0.0.1:8768/health && break || sleep 1; done
          curl -fsS http://127.0.0.1:8768/health
          python live_replay.py --output replay-public.json
          openenv validate --url http://127.0.0.1:8768 --level runtime --json > validation-public.json
          curl -fsS http://127.0.0.1:8768/schema > schema-public.json
          python - <<'PY'
          import json
          assert json.load(open('schema-public.json'))==json.load(open('submission-quantitative-v1.json'))['schema']
          assert json.load(open('validation-public.json'))['passed']
          image=json.load(open('image-public-inspect.json'))[0]
          assert image['Architecture']=='amd64' and image['Os']=='linux'
          assert image['Config']['User']=='quant'
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: quantitative-v1-anonymous-verification
          path: |
            image-public-inspect.json
            replay-public.json
            validation-public.json
            schema-public.json
      - name: Publish public verification reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload quantitative-v1 image-public-inspect.json replay-public.json validation-public.json schema-public.json
